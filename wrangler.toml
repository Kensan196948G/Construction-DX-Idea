name = "construction-dx-idea-api"
main = "worker/index.ts"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]

# Same-origin production: this Worker serves both the SPA static assets and
# the /api/* routes on https://dxidea.mirai-dx-platform.com.
# Custom Domains take a hostname-only pattern with no zone_name (Cloudflare docs).
# NOTE (2026-08-31): 現行本番は Cloudflare Tunnel（cfargotunnel.com CNAME）経由で
# ローカルsystemdサービス（dx-idea-api.service）へ配信しているため、wrangler deploy 時に
# このcustom domain再割当は code:100117（DNSレコードがトンネルに管理されている）で失敗する。
# Worker配信へ戻す場合はトンネルCNAME削除後にこの設定が有効になる。
routes = [
  { pattern = "dxidea.mirai-dx-platform.com", custom_domain = true }
]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/10 * * * *", "0 * * * *", "0 9 * * SUN"]

[vars]
AI_PROVIDER = "claude"
AI_MODEL = "claude-sonnet-5"
AI_ENABLED = "true"
DAILY_AI_LIMIT = "10"
MAX_INPUT_CHARS = "2000"
APP_BASE_URL = "https://dxidea.mirai-dx-platform.com"
ALLOWED_ORIGINS = "https://dxidea.mirai-dx-platform.com"
ADMIN_EMAILS = "kensan1969@gmail.com"
SYSTEM_ADMIN_EMAILS = "kensan1969@gmail.com"
ALLOW_LOCAL_AUTH_BYPASS = "false"
# Cloudflare Access application "Construction-DX-Idea" (team winter-lake-f4c9,
# created 2026-07-21). These are public verification parameters, not secrets.
CF_ACCESS_CERTS_URL = "https://winter-lake-f4c9.cloudflareaccess.com/cdn-cgi/access/certs"
CF_ACCESS_AUD = "547b7a547cff09ea0f341c289986415a5ee2b992a8d98d2df7a3a31ea96d6e73"
CF_ACCESS_ISSUER = "https://winter-lake-f4c9.cloudflareaccess.com"
AI_INPUT_COST_PER_1K_TOKENS = "0.003"
AI_OUTPUT_COST_PER_1K_TOKENS = "0.015"

# Secrets (set at Stage B; values are never committed or printed):
# wrangler secret put DATABASE_URL
# wrangler secret put ANTHROPIC_API_KEY   (only when AI is enabled)
# wrangler secret put SLACK_WEBHOOK_URL   (optional)
# NOTE (2026-08-31〜): DB はローカル PostgreSQL（Neon 廃止済み）。現行配信は
# Cloudflare Tunnel → ローカル systemd サービス（dx-idea-api / dx-idea-mvp-api）が
# 127.0.0.1 の PostgreSQL（dx_idea / dx_idea_mvp）へ接続する。Worker 配信へ戻す場合のみ
# DATABASE_URL secret にローカルDB接続文字列を設定する（ドライバはホストで自動選択）。

# ---------------------------------------------------------------------------
# MVP/Prototype environment (https://dxidea-mvp.mirai-dx-platform.com)
#
# Fully separated from production:
#   - its own Worker name + custom domain
#   - its own local PostgreSQL database dx_idea_mvp (seeded with fictional demo data;
#     Neon branch は 2026-08-31 に廃止・ローカルPostgreSQLへ移行済み)
#   - ALLOW_LOCAL_AUTH_BYPASS=true: no Cloudflare Access gate so reviewers can
#     open the URL and operate every screen immediately (write-rate limited)
#   - AI_PROVIDER=demo: deterministic local responses, no API key, no cost
# Secrets: wrangler secret put DATABASE_URL --env mvp
# ---------------------------------------------------------------------------
[env.mvp]
name = "construction-dx-idea-api-mvp"
routes = [
  { pattern = "dxidea-mvp.mirai-dx-platform.com", custom_domain = true }
]
# The MVP environment has no Slack webhook, so the production retry/alert
# crons are unnecessary here. Overriding with an empty list also keeps the
# Free plan's account-level cron trigger quota free.
[env.mvp.triggers]
crons = []

[env.mvp.vars]
APP_BASE_URL = "https://dxidea-mvp.mirai-dx-platform.com"
ALLOWED_ORIGINS = "https://dxidea-mvp.mirai-dx-platform.com"
ALLOW_LOCAL_AUTH_BYPASS = "true"
ADMIN_EMAILS = ""
SYSTEM_ADMIN_EMAILS = ""
AI_PROVIDER = "demo"
AI_MODEL = "demo-local"
AI_ENABLED = "true"
DAILY_AI_LIMIT = "10"
MAX_INPUT_CHARS = "2000"
AI_INPUT_COST_PER_1K_TOKENS = "0.003"
AI_OUTPUT_COST_PER_1K_TOKENS = "0.015"
# Access JWT settings are unused while ALLOW_LOCAL_AUTH_BYPASS is enabled.
CF_ACCESS_CERTS_URL = ""
CF_ACCESS_AUD = ""
CF_ACCESS_ISSUER = ""
